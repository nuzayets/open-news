name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificates
        env:
          CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificates.p12"

      - name: Build and sign
        env:
          APP_IDENTITY: Developer ID Application
          INSTALLER_IDENTITY: Developer ID Installer
        run: scripts/package.sh "${VERSION#v}"

      - name: Test native host
        run: test/host.sh "dist/root/Library/Application Support/OpenInNews/open-in-news-host"

      - name: Notarize
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          pkg="dist/OpenInNews-${VERSION#v}.pkg"
          echo "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$pkg" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID" --wait
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$pkg"
          spctl --assess --type install -vv "$pkg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "$VERSION" --verify-tag --generate-notes OpenInNews-*.pkg open-in-news-extension-*.zip
